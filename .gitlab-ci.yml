include:
  - project: 'aimms/user-support/templates/template-cicd'
    ref: main
    file: '.gitlab-ci-toolkit.yml'

# This toolkit is an AIMMS library: the template reads the AIMMS version from its
# Project.xml and keeps the badge in README.md up to date.
#
# The badges of article 717 come from the example project 717-ui-tools-test, which
# also has the WebUI version. Only one project per article updates its badges, so
# this toolkit does not.
update-howto:
  rules:
    - when: never
